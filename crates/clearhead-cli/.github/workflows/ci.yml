name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CLI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: workspace/clearhead-cli
          persist-credentials: false

      # The crates intentionally use sibling path dependencies in the platform
      # workspace. Check out those exact siblings rather than hiding the seam
      # behind registry substitutions that local development does not use.
      - name: Checkout core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ClearHeadToDo-Devs/clearhead-core
          path: workspace/clearhead-core
          persist-credentials: false

      - name: Checkout tree-sitter grammar
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ClearHeadToDo-Devs/tree-sitter-actions
          path: workspace/tree-sitter-actions
          persist-credentials: false

      # JSON-LD is intentionally an out-of-process graphd capability. Tests
      # compose the real sibling binary rather than pulling graph code back
      # into the CLI crate.
      - name: Checkout graphd
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ClearHeadToDo-Devs/clearhead-graphd
          path: workspace/clearhead-graphd
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Format
        working-directory: workspace/clearhead-cli
        run: cargo fmt --check

      - name: Clippy
        working-directory: workspace/clearhead-cli
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Build graphd integration dependency
        working-directory: workspace/clearhead-graphd
        run: cargo build --locked

      - name: Test
        working-directory: workspace/clearhead-cli
        env:
          CLEARHEAD_GRAPHD: ${{ github.workspace }}/workspace/clearhead-graphd/target/debug/clearhead-graphd
        run: cargo test --locked
