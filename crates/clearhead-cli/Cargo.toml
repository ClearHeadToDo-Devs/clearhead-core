[package]
name = "clearhead_cli"
description = "A CLI tool and library for working with the clearhead framework"
version = "0.2.1"
authors = ["Darrion Burgess <darrionburgess@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ClearHeadToDo-Devs/clearhead_cli.git"

[[bin]]
name = "clearhead"
path = "src/main.rs"

[features]
default = ["sparql"]
# Optional in-process SPARQL query layer (rdf-publication charter): the only
# feature that pulls Oxigraph. It evaluates Core's canonical dataset in an
# ephemeral in-memory store — no persistence, no foreign-RDF loading. Build
# with `--no-default-features` for the minimal, query-engine-free profile.
sparql = ["dep:oxigraph", "dep:petgraph"]
# Opt-in conformance of the CLI's real index query output against the
# specification's published index_query_result schema. Bare `cargo test` stays
# independent of a specifications checkout; the super-repo runs this with
# CLEARHEAD_SPEC_DIR. Implies `sparql`: the index family is evaluated in-process
# by the query engine, so the producer boundary only exists when it is built.
spec-conformance = ["sparql"]

[dependencies]
# Shared domain, workspace, persistence, and configuration services
clearhead_core = { path = "../clearhead-core", version = "0.2.0", default-features = false, features = ["formatting"] }
clearhead-workspace-fs = { path = "../clearhead-workspace-fs", version = "0.1.0" }

# CLI-specific dependencies
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
anyhow = "1.0"
comfy-table = "7.1"
termtree = "1.0.0"
config = { version = "0.15.19", default-features = false, features = ["json"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tree-sitter = "0.26.3"
# Consumed from its canonical repository so a standalone checkout builds
# without a sibling grammar checkout. The pinned platform composition and
# local sibling development override this to the adjacent path via the
# platform `.cargo/config.toml` `[patch]` table.
tree-sitter-actions = { git = "https://github.com/ClearHeadToDo-Devs/tree-sitter-actions.git", rev = "b6a2579f49df113f2f1a0069b54c05780960ee19", version = "0.10.0" }
# RDF term types for the always-on workspace dataset assembly (export plus the
# query layer). Same oxrdf version Core's rdf module uses, so quads are one
# shared type; the query *engine* stays behind the optional `sparql` feature.
oxrdf = "0.3.3"
# In-memory one-shot SPARQL evaluator, pulled only by the `sparql` feature.
# default-features = false: no RocksDB, no persistence — the store is created
# empty per query and dropped with the command.
oxigraph = { version = "0.5.3", default-features = false, optional = true }
# Graphviz DOT projection for the `graph` query family; same version graphd
# used, so the rendered DOT is byte-identical. Pulled only by `sparql`.
petgraph = { version = "0.8", optional = true }

[dependencies.uuid]
version = "1.0"
# Lets you generate random UUIDs
features = [
  "serde",
  "v4",
  "v7",
]

[dev-dependencies]
assert_cmd = "2.1"
clap_mangen = "0.3"
insta = { version = "1.45.1", features = ["filters", "redactions", "ron"] }
# Local schema validation for the spec-conformance suite; no HTTP/file
# reference resolution or its async stack.
jsonschema = { version = "0.18", default-features = false }
predicates = "3.0"
tempfile = "3.8"
