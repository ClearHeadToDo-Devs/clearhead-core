[package]
name = "clearhead-lsp"
version = "0.1.0"
authors = ["Darrion Burgess <darrionburgess@gmail.com>"]
edition = "2024"
description = "Standalone Language Server Protocol runtime for ClearHead"
license = "MIT"
repository = "https://github.com/ClearHeadToDo-Devs/clearhead-lsp.git"

[[bin]]
name = "clearhead-lsp"
path = "src/main.rs"

[dependencies]
# Consumed from canonical repositories so a standalone LSP checkout builds
# without sibling checkouts. The pinned platform composition and local sibling
# development override these to adjacent paths via the platform
# `.cargo/config.toml` `[patch]` table; see the README.
clearhead_core = { git = "https://github.com/ClearHeadToDo-Devs/clearhead-core.git", rev = "cdb579787ea7863961ad97c04c174757fbb9a7f7", version = "0.2.0", default-features = false, features = ["formatting"] }
chrono = "0.4"
dashmap = "6.1.0"
serde_json = "1.0"
# The LSP owns the async runtime, but only needs stdio, task execution, macros,
# and synchronization—not Tokio's network, process, signal, filesystem, or time APIs.
tokio = { version = "1.48.0", features = ["io-std", "macros", "rt-multi-thread", "sync"] }
tower-lsp-server = "0.23.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
tree-sitter = "0.26.3"
tree-sitter-actions = { git = "https://github.com/ClearHeadToDo-Devs/tree-sitter-actions.git", rev = "b6a2579f49df113f2f1a0069b54c05780960ee19", version = "0.10.0" }
uuid = "1.0"

[dev-dependencies]
tempfile = "3.8"
