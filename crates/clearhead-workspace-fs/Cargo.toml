[package]
name = "clearhead-workspace-fs"
description = "Native filesystem delivery adapter for ClearHead workspaces"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clearhead_core = { path = "../clearhead-core", version = "0.2.0", default-features = false, features = ["formatting"] }
serde = { version = "1.0", features = ["derive"] }
chrono = "0.4"
config = { version = "0.15.19", default-features = false, features = ["json"] }
dirs = "6.0.0"
shellexpand = "3.1"
tracing = "0.1.44"
thiserror = "2.0"
blake3 = "1.8"
uuid = "1.0"
serde_json = "1.0"
fs2 = "0.4"
tempfile = "3.8"

[dev-dependencies]
ron = "0.8"
