# The `clearhead-rs` workspace: the Rust codebase for the ClearHead platform.
#
# This is a virtual manifest — it defines no package of its own. Every crate,
# including the pure domain core, is an equal member under `crates/`. Keeping the
# workspace root package-less is deliberate: the core library must not name or
# "parent" its own downstream hosts. Core decides; the hosts and the delivery
# adapter depend on it, never the reverse.
#
# Cargo has no name field for a virtual workspace, so `clearhead-rs` is asserted
# here in metadata and in the README rather than enforced by Cargo.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.metadata]
name = "clearhead-rs"
description = "Rust workspace for the ClearHead platform (pure domain core, native filesystem delivery adapter, CLI, and LSP)."
