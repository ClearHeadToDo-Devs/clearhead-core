[package]
name = "clearhead_core"
description = "Core domain model and logic for the ClearHead framework"
version = "0.2.0"
authors = ["Darrion Burgess <darrionburgess@gmail.com>"]
edition = "2024"
license = "MIT"
repository = "https://github.com/ClearHeadToDo-Devs/clearhead-core.git"

[features]
default = ["formatting"]
# Canonical .actions source formatting. Read-only consumers can disable default
# features to avoid Topiary and its async runtime dependency closure.
formatting = ["dep:topiary-core", "dep:topiary-tree-sitter-facade"]
# Runs the end-to-end conformance test that validates Core's canonical JSON
# projection against the specifications repo's actions schema. Off by default so
# a bare `cargo test` needs neither jsonschema nor a specifications checkout.
spec-conformance = ["dep:jsonschema"]

[dependencies]
# Shared domain, workspace, persistence, and configuration dependencies
chrono = { version = "0.4", features = ["serde"] }
config = { version = "0.15.19", default-features = false, features = ["json"] }
dirs = "6.0.0"
icalendar = { version = "0.17.10", features = ["chrono-tz"] }
jsonschema = { version = "0.18", optional = true }
fs2 = "0.4"
shellexpand = "3.1"
tracing = "0.1.44"
quick-xml = { version = "0.31", features = ["serialize"] }
rrule = "0.14.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
thiserror = "2.0"
topiary-core = { version = "0.7.3", optional = true }
topiary-tree-sitter-facade = { version = "0.7.3", optional = true }
tree-sitter = "0.26.3"
tree-sitter-actions = { path = "../tree-sitter-actions", version = "0.10.0" }

[dependencies.uuid]
version = "1.0"
features = [
  "serde",
  "v4",
  "v5",
  "v7",
]

[dev-dependencies]
proptest = "1.7"
ron = "0.8"

[dependencies.tempfile]
version = "3.8"
