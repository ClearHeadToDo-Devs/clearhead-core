[package]
name = "clearhead-graphd"
version = "0.1.0"
edition = "2024"
description = "Standalone graph/query binary for ClearHead"
license = "MIT"

[[bin]]
name = "clearhead-graphd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
clearhead_core = { path = "../clearhead-core", version = "0.2.0" }
comfy-table = "7.1"
chrono = "0.4"
config = { version = "0.15.19", default-features = false, features = ["json"] }
# graphd uses only Oxigraph's in-memory store; RocksDB is not part of its
# runtime or persistence contract.
oxigraph = { version = "0.5.3", default-features = false }
petgraph = "0.8"
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1.44"
uuid = "1.0"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.0"
jsonschema = "0.18"
predicates = "3.1"
tempfile = "3.0"
