name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: workspace/clearhead-core

      # The crates intentionally use sibling path dependencies in the platform
      # workspace. Check out those exact siblings rather than hiding the seam
      # behind registry substitutions that local development does not use.
      - name: Checkout tree-sitter grammar
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: ClearHeadToDo-Devs/tree-sitter-actions
          path: workspace/tree-sitter-actions

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Format
        working-directory: workspace/clearhead-core
        run: cargo fmt --check

      - name: Clippy
        working-directory: workspace/clearhead-core
        run: cargo clippy --all-targets --no-deps --locked -- -D warnings

      - name: Check read-only capability set
        working-directory: workspace/clearhead-core
        run: |
          cargo check --no-default-features --locked
          cargo test --no-default-features --locked

      - name: Test
        working-directory: workspace/clearhead-core
        run: cargo test --locked
