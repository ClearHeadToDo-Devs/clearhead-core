name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # One repository, one workspace: core, CLI, LSP, and graphd build from a
      # single checkout with sibling path dependencies. The only out-of-repo
      # dependency is the tree-sitter grammar, fetched from its canonical Git
      # repository like any other consumer.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --no-deps --locked -- -D warnings

      - name: Check core read-only capability set
        run: |
          cargo check -p clearhead_core --no-default-features --locked
          cargo test -p clearhead_core --no-default-features --locked

      # JSON-LD is intentionally an out-of-process graphd capability. CLI tests
      # compose the real sibling binary from the shared workspace target dir.
      - name: Build graphd integration dependency
        run: cargo build -p clearhead-graphd --locked

      - name: Test
        env:
          CLEARHEAD_GRAPHD: ${{ github.workspace }}/target/debug/clearhead-graphd
        run: cargo test --workspace --locked
